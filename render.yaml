services:
  - type: web
    name: profportfolio-api
    runtime: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run prisma:generate && npm run prisma:push
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      # Set these in Render dashboard (do not commit secrets):
      # - DATABASE_URL
      # - JWT_SECRET
      # - CLIENT_ORIGIN (your GitHub Pages URL)
