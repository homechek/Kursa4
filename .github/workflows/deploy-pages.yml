name: Deploy client to GitHub Pages (branch)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          # Required for GitHub Pages (/<repo>/)
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set this in repo Settings -> Secrets and variables -> Actions -> Variables
          # Example: https://your-api.onrender.com
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: SPA fallback (404.html) + disable Jekyll
        run: |
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          publish_branch: gh-pages
          force_orphan: true
